# Untuned prior for pool identification: everything else (body, rigid inertia, buoyancy radii, thruster
# dynamics, limits, hardware thrust model) is talos.yaml's. What pool_identify learns is zeroed: diagonal added
# mass and linear/quadratic drag on all six axes, COB at the COM, and buoyancy neutral (displaced volume =
# mass / water_density; 0 would sink the vehicle). Per-thruster scales stay 1.
# Fly it with mpc_model:=talos_untuned and run pool_identify with model:=talos_untuned. Keep it in step with
# talos.yaml when the non-identified parts change.
robot: talos
mass: 34.084
com: [-0.150, 0.041, -0.016]
rigid_body_inertia3x3:
- [1.8429, 0.0496, 0.0945]
