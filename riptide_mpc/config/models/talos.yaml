# The MPC's model of the REAL Talos (default on hardware). Pool-identified 2026-10-03, session
# talos_20261003_165241, flown WITH hardware.rpm_offset 140 (mpc.yaml), so thrust matched the force
# curve: statics, drag on surge/sway/heave/yaw, added mass sway/heave/yaw. Surge added mass stays the
# simulator value: the fit (97.6 kg) flew worse, since slow ESC startup from ~0 rpm reads as inertia.
# Body: the 2026-10-03 post-pool WET weigh-in. Identified with the dry 32.444 kg / [-0.150, 0.037, -0.013];
# the volume, COB and surge/sway/heave added mass are re-expressed for the wet body, so net buoyancy
# (+1.2 N), the in-water torques and the total inertia are unchanged. Change the body and re-identify.
# rpm_offset is now 0 (ESC CAN decode bug fixed in firmware), so re-identify on the fixed firmware.
