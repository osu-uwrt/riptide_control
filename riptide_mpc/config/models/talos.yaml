# Hardware actuation (not used by the simulator). The thrust limits must match
# what the thruster/ESC stack enforces (riptide_descriptions talos.yaml
# thruster_solver.*), and the curve must match the ESC firmware's RPM units.
hardware:
  can_interface: can0
  total_thrust_limit: 73.0   # N, sum over thrusters of |force| (power budget)
  # Force [N] -> requested RPM, as in complete_controller's "Force to RPM
  # Transform": rpm = c0 + c1*F + c2*tanh(F) + c3*|F|^(1/4), positive curve for
  # F > 0, negative curve for F < 0 (riptide_descriptions talos.yaml
  # force_to_rpm_coefficents).
  force_to_rpm_positive: [-475.886186, 32.327429, -324.744664, 1443.832105]
  force_to_rpm_negative: [257.460623, 42.948545, -24.402056, -986.338071]
